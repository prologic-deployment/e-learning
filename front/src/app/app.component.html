<app-navbar *ngIf="!(location == '/thank-you' || location == '/coming-soon')"></app-navbar>

<router-outlet></router-outlet>

<app-footer *ngIf="!(location == '/thank-you' || location == '/coming-soon')"></app-footer>

<!-- ✅ Toast Notifications -->
<div style="position: fixed; top: 24px; right: 24px; z-index: 999999;
  display: flex; flex-direction: column; gap: 12px;
  max-width: 380px; width: 100%; pointer-events: none;">

  <div *ngFor="let toast of toasts"
    style="background: white; border-radius: 16px; padding: 16px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid #e2e8f0;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden; position: relative; pointer-events: all;"
    [style.borderLeft]="'4px solid ' + getNotifColor(toast.type)"
    [style.transform]="toast.visible ? 'translateX(0)' : 'translateX(120%)'"
    [style.opacity]="toast.visible ? '1' : '0'">

    <div style="display: flex; align-items: flex-start; gap: 12px;">

      <!-- Icône -->
      <div style="width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: center; font-size: 20px;"
        [style.background]="getNotifColor(toast.type) + '22'">
        {{ getNotifIcon(toast.type) }}
      </div>

      <!-- Texte -->
      <div style="flex: 1; min-width: 0;">
        <div style="font-weight: 700; color: #0f172a; font-size: 14px; margin-bottom: 4px;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
          {{ toast.title }}
        </div>
        <div style="font-size: 12px; color: #64748b; line-height: 1.5;">
          {{ toast.message }}
        </div>
      </div>

      <!-- Fermer -->
      <button (click)="closeToast(toast.id)"
        style="background: none; border: none; color: #94a3b8; cursor: pointer;
          font-size: 16px; padding: 0; flex-shrink: 0; line-height: 1;"
        onmouseover="this.style.color='#374151'"
        onmouseout="this.style.color='#94a3b8'">
        ✕
      </button>
    </div>

    <!-- Barre de progression -->
    <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
      background: #f1f5f9;">
      <div style="height: 100%;"
        [style.background]="getNotifColor(toast.type)"
        [style.animation]="toast.visible ? 'shrinkBar 5s linear forwards' : 'none'">
      </div>
    </div>

  </div>
</div>
