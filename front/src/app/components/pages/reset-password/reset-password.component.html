<main class="recovery-page product-page">
  <app-brand class="recovery-brand"/>
  <section hlmCard class="recovery-card">
    <span class="eyebrow">ACCOUNT RECOVERY / 02</span><h1>Make it yours again.</h1><p>Choose a strong, unique password for your account.</p>
    <div *ngIf="error" class="product-alert" role="alert">{{error}}</div><div *ngIf="success" class="product-alert success" role="status">{{success}}</div>
    <form *ngIf="validLink && !success" #resetForm="ngForm" (ngSubmit)="resetForm.valid && resetPassword()" [attr.aria-busy]="loading">
      <app-form-field label="New password" [required]="true" hint="At least 8 characters, one uppercase letter and a number. Maximum 72 bytes."><input hlmInput type="password" name="newPassword" autocomplete="new-password" [(ngModel)]="newPassword" minlength="8" maxlength="72" pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}" required></app-form-field>
      <app-form-field label="Confirm new password" [required]="true" hint="Enter the same password again."><input hlmInput type="password" name="confirmPassword" autocomplete="new-password" [(ngModel)]="confirmPassword" required></app-form-field>
      <button hlmBtn type="submit" [disabled]="loading">{{loading ? 'Updating password…' : 'Save new password'}}</button>
    </form>
    <aside><i class="bx bx-shield-quarter" aria-hidden="true"></i><p>All existing sessions will be signed out. Your authenticator, if enabled, stays enabled.</p></aside>
    <div class="recovery-links"><a hlmBtn [variant]="success ? 'default' : 'link'" routerLink="/profile-authentication">Back to sign in</a><a *ngIf="!success" hlmBtn variant="link" routerLink="/forgot-password">Request a new link</a></div>
  </section>
  <p class="recovery-note">Learn with focus. Return with confidence.</p>
</main>
