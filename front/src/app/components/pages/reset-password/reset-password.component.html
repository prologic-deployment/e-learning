<div class="page-title-area">
  <div class="container">
    <div class="page-title-content">
      <ul><li><a routerLink="/">Home</a></li><li>Reset Password</li></ul>
      <h1>Reset Password</h1>
    </div>
  </div>
</div>

<div class="profile-authentication-area ptb-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-8">
        <div class="login-form">

          <div class="text-center mb-4">
            <div style="width: 70px; height: 70px;
              background: linear-gradient(135deg, #667eea, #764ba2);
              border-radius: 50%; display: flex; align-items: center;
              justify-content: center; margin: 0 auto 15px;">
              <span style="font-size: 30px;">🔑</span>
            </div>
            <h3 style="font-weight: 700;">Reset Password</h3>
            <p class="text-muted">Enter your new password below.</p>
          </div>

          <div *ngIf="success" class="alert alert-success text-center">
            ✅ {{ success }}
            <br>
            <a routerLink="/profile-authentication"
              style="color: #667eea;">Go to Login</a>
          </div>
          <div *ngIf="error" class="alert alert-danger text-center">
            {{ error }}
          </div>

          <div *ngIf="!success">
            <div class="form-group mb-3">
              <label>New Password *</label>
              <input type="password" class="form-control mt-1"
                placeholder="New password"
                [(ngModel)]="newPassword">
              <small class="text-muted">Min 8 chars, 1 uppercase, 1 number</small>
            </div>

            <div class="form-group mb-4">
              <label>Confirm Password *</label>
              <input type="password" class="form-control mt-1"
                placeholder="Confirm password"
                [(ngModel)]="confirmPassword">
            </div>

            <button class="default-btn w-100"
              (click)="resetPassword()"
              [disabled]="loading"
              style="padding: 14px; border-radius: 12px;">
              <span *ngIf="!loading">🔑 Reset Password</span>
              <span *ngIf="loading">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Resetting...
              </span>
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
