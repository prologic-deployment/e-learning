<main class="recovery-page product-page">
  <app-brand class="recovery-brand"/>
  <section hlmCard class="recovery-card">
    <span class="eyebrow">ACCOUNT RECOVERY / 01</span><h1>A fresh start.</h1><p>Forgot your password? Request a secure link to choose a new one.</p>
    <div *ngIf="error" class="product-alert" role="alert">{{error}}</div>
    <div *ngIf="success" class="product-alert success" role="status">{{success}}</div>
    <form *ngIf="!success" #recoveryForm="ngForm" (ngSubmit)="recoveryForm.valid && sendResetLink()" [attr.aria-busy]="loading">
      <app-form-field label="Account email" [required]="true" hint="Use the email address you registered with."><input hlmInput name="email" type="email" email autocomplete="email" [(ngModel)]="email" required></app-form-field>
      <button hlmBtn type="submit" [disabled]="loading">{{loading ? 'Requesting your link…' : 'Send reset link'}} <span aria-hidden="true">↗</span></button>
    </form>
    <button *ngIf="success" hlmBtn variant="outline" (click)="success = ''; error = ''">Try another email</button>
    <aside><i class="bx bx-shield-quarter" aria-hidden="true"></i><p>Reset links expire after ten minutes. Resetting your password does not remove authenticator protection.</p></aside>
    <a hlmBtn variant="link" routerLink="/profile-authentication">← Back to sign in</a>
  </section>
  <p class="recovery-note">Learn with focus. Return with confidence.</p>
</main>
