<section class="cats">
  <div class="container">
    <div class="section-title cats__title">
      <span class="sub-title">Explore</span>
      <h2>Top Categories</h2>
      <p>Hands-on tracks for IT professionals — from code to infrastructure to security.</p>
    </div>

    <div class="cats__grid">
      <a *ngFor="let cat of categories; let i = index" class="cats__tile"
         [routerLink]="['/courses-grid']" [queryParams]="{category: cat.name}">
        <span class="cats__num">{{ (i + 1) < 10 ? '0' + (i + 1) : (i + 1) }}</span>
        <span class="cats__icon"><i [class]="cat.icon"></i></span>
        <span class="cats__name">{{ cat.name }}</span>
        <span class="cats__desc">{{ cat.description }}</span>
        <span class="cats__arrow"><i class="bx bx-right-arrow-alt"></i></span>
      </a>
    </div>
  </div>
</section>
