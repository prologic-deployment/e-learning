<div class="page-title-area">
  <div class="container">
    <div class="page-title-content">
      <ul><li><a routerLink="/">Home</a></li><li>Forgot Password</li></ul>
      <h1>Forgot Password</h1>
    </div>
  </div>
</div>

<div class="profile-authentication-area ptb-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-8">
        <div class="login-form">

          <div class="text-center mb-4">
            <div style="width: 70px; height: 70px;
              background: linear-gradient(135deg, #457B9D, #1D3557);
              border-radius: 50%; display: flex; align-items: center;
              justify-content: center; margin: 0 auto 15px;">
              <span style="font-size: 30px;">🔐</span>
            </div>
            <h3 style="font-weight: 700;">Forgot Password ?</h3>
            <p class="text-muted">Enter your email and we'll send you a reset link.</p>
          </div>

          <div *ngIf="success" class="alert alert-success text-center">
            ✅ {{ success }}
          </div>
          <div *ngIf="error" class="alert alert-danger text-center">
            {{ error }}
          </div>

          <div *ngIf="!success">
            <div class="form-group mb-3">
              <label>Email Address *</label>
              <input type="email" class="form-control mt-1"
                placeholder="your@email.com"
                [(ngModel)]="email">
            </div>

            <button class="default-btn w-100"
              (click)="sendResetLink()"
              [disabled]="loading"
              style="padding: 14px; border-radius: 12px;">
              <span *ngIf="!loading">📧 Send Reset Link</span>
              <span *ngIf="loading">
                <span class="spinner-border spinner-border-sm me-2"></span>
                Sending...
              </span>
            </button>
          </div>

          <div class="text-center mt-3">
            <a routerLink="/profile-authentication"
              style="color: #457B9D; text-decoration: none;">
              ← Back to Login
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
